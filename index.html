<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أنشطة وتجارب فيزياء السادس العلمي | إشراف الأستاذ غزوان محمد</title>
  <style>
    :root {
      --bg-color: #fcfcfc;
      --card-bg: #ffffff;
      --text-color: #222222;
      --text-muted: #555555;
      --border-color: #dddddd;
      --accent-color: #1a73e8;
      --accent-light: #e8f0fe;
      --tag-bg: #eeeeee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 25px 15px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--text-color);
      margin-bottom: 8px;
    }

    .supervisor {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-color);
      display: inline-block;
      padding: 4px 12px;
      background: var(--accent-light);
      border-radius: 4px;
      margin-top: 5px;
    }

    .controls {
      background: var(--card-bg);
      padding: 15px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent-color);
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn:hover, .btn.active {
      background: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .experiments-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .experiment-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f0f0f0;
    }

    .card-title {
      font-size: 1.2rem;
      color: #111111;
    }

    .chapter-tag {
      font-size: 0.8rem;
      background: var(--tag-bg);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .section-title {
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: var(--accent-color);
    }

    ul, ol {
      padding-right: 20px;
      margin-bottom: 10px;
    }

    li {
      margin-bottom: 4px;
      font-size: 0.92rem;
    }

    .conclusion {
      background: #f8f9fa;
      border-right: 3px solid var(--accent-color);
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 15px;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>مكتبة أنشطة وتجارب فيزياء السادس العلمي (2026)</h1>
      <div class="supervisor">إشراف الأستاذ: غزوان محمد</div>
    </header>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث عن نشاط، تجربة، أو أداة..." oninput="filterExperiments()">
      </div>
      <div class="filter-buttons" id="filterButtons">
        <button class="btn active" onclick="setFilter('all', this)">الكل</button>
        <button class="btn" onclick="setFilter('1', this)">الفصل 1</button>
        <button class="btn" onclick="setFilter('2', this)">الفصل 2</button>
        <button class="btn" onclick="setFilter('3', this)">الفصل 3</button>
        <button class="btn" onclick="setFilter('4', this)">الفصل 4</button>
        <button class="btn" onclick="setFilter('5', this)">الفصل 5</button>
        <button class="btn" onclick="setFilter('6', this)">الفصل 6</button>
        <button class="btn" onclick="setFilter('7', this)">الفصل 7</button>
      </div>
    </div>

    <div class="experiments-list" id="experimentsContainer">
      <!-- يتم تحميل الأنشطة عبر JavaScript -->
    </div>

    <footer>
      منهج الفيزياء للصف السادس العلمي - معتمد للعام الدراسي 2025/2026
    </footer>
  </div>

  <script>
    const data = [
      {
        id: 1,
        chapter: "1",
        chapterName: "الفصل الأول: المتسعات",
        title: "نشاط: شحن وتفريغ المتسعة",
        tools: ["بطارية ذات فولتية مناسبة", "جلفانوميتر صفر في الوسط (G)", "مصباحان يماثلان L1 و L2", "متسعة C ذات الصفحتين A و B", "مفتاح مزدوج K", "مقاومة R وأسلاك توصيل"],
        steps: [
          "ربط الدائرة كما في المخطط بحيث يكون المفتاح K في الموقع 1 (عملية الشحن).",
          "نلاحظ انحراف مؤشر الجلفانوميتر لحظياً إلى جانب معين (مثلاً اليمين) وتوهج المصباح L1 برهة من الزمن ثم انطفائه وعودة المؤشر إلى الصفر.",
          "نربط المفتاح K في الموقع 2 (عملية التفريغ).",
          "نلاحظ انحراف المؤشر بالاتجاه المعاكس وتوهج المصباح L2 برهة من الزمن ثم انطفائه وعودة المؤشر للصفر."
        ],
        conclusion: "عند اكتمال شحن المتسعة يتساوى جهد كل صفيحة مع قطب البطارية الموصول بها فتصبح الدائرة مفتوحة. عند التفريغ تفرغ الشحنات عبر السلك الموصل لحظياً."
      },
      {
        id: 2,
        chapter: "2",
        chapterName: "الفصل الثاني: الحث الكهرومغناطيسي",
        title: "نشاط: ظاهرة الحث الكهرومغناطيسي (تجربة فرداي)",
        tools: ["ملفان سلكيان مجوفان أحدهما يدخل في الآخر", "جلفانوميتر صفر الوسط", "ساق مغناطيسية", "بطارية", "مفتاح كهربائي", "أسلاك توصيل"],
        steps: [
          "ربط أحد الملفين بالجلفانوميتر وتقريب/إبعاد الساق المغناطيسية عنه.",
          "نلاحظ انحراف المؤشر باتجاه معين عند التقريب وباتجاه معاكس عند الإبعاد وتوقفه عند ثبوت الساق.",
          "ربط الملف الثاني بالبطارية والمفتاح (ملف ابتدائي) وإدخاله داخل الملف الأول.",
          "فتح وغلق المفتاح الكهربائي ونلاحظ انحراف مؤشر الجلفانوميتر لحظة الغلق ولحظة الفتح."
        ],
        conclusion: "تستحث قوة دافعة كهربائية وتيار محث في دائرة كهربائية مغلقة فقط عند حصول تغير في الفيض المغناطيسي الذي يخترق الدائرة لوحدة الزمن."
      },
      {
        id: 3,
        chapter: "2",
        chapterName: "الفصل الثاني: الحث الكهرومغناطيسي",
        title: "نشاط: ظاهرة الحث الذاتي",
        tools: ["ملف سلكي في جوفه قلب من الحديد المطاوع", "مصباح نيون يحتاج 80V", "بطارية فولتيتها 9V", "مفتاح كهربائي", "أسلاك توصيل"],
        steps: [
          "نربط الملف والمفتاح والبطارية على التوالي، ونربط مصباح النيون على التوازي مع الملف.",
          "نغلق دائرة المفتاح: نلاحظ عدم توهج مصباح النيون.",
          "نفتح دائرة المفتاح: نلاحظ توهج مصباح النيون لبرهة قصيرة من الزمن."
        ],
        conclusion: "يتولد على طرفي الملف قوة دافعة كهربائية محثة ذاتية كبيرة جداً لحظة الفتح بسبب التلاشي السريع للتيار تكفي لتوهج المصباح."
      },
      {
        id: 4,
        chapter: "3",
        chapterName: "الفصل الثالث: التيار المتناوب",
        title: "نشاط: تأثير تغير تردد التيار (f) في رادة الحث (XL)",
        tools: ["مذيذب كهربائي (مصدر متناوب متغير التردد)", "أميتر", "فولطميتر", "ملف مهمل المقاومة", "مفتاح كهربائي"],
        steps: [
          "نربط الملف والأميتر والمذيذب على التوالي، والفولطميتر على التوازي مع الملف.",
          "نزيد تردد المذيذب مع الحفاظ على ثبوت قراءة الفولطميتر.",
          "نلاحظ نقصان قراءة الأميتر (نقصان التيار)."
        ],
        conclusion: "رادة الحث XL تتناسب طردياً مع تردد المصدر (f) بثبوت معامل الحث الذاتي (L)."
      },
      {
        id: 5,
        chapter: "3",
        chapterName: "الفصل الثالث: التيار المتناوب",
        title: "نشاط: تأثير تغير تردد الفولتية (f) في رادة السعة (XC)",
        tools: ["مذيذب كهربائي", "أميتر", "فولطميتر", "متسعة ذات صفحتين متوازيتين", "مفتاح كهربائي"],
        steps: [
          "نربط المتسعة والأميتر والمذيذب على التوالي، والفولطميتر على التوازي مع المتسعة.",
          "نزيد تردد المذيذب تدريجياً مع الحفاظ على فرق الجهد ثابتاً.",
          "نلاحظ زيادة قراءة الأميتر (زيادة التيار)."
        ],
        conclusion: "رادة السعة XC تتناسب عكسياً مع تردد مصدر الفولتية (f) بثبوت سعة المتسعة (C)."
      },
      {
        id: 6,
        chapter: "4",
        chapterName: "الفصل الرابع: البصريات الموجية",
        title: "نشاط: تجربة شقّي يونغ",
        tools: ["حاجز ذو شق واحد", "حاجز ذو شقين ضيقين متماثلين", "شاشة", "مصدر ضوئي أحادي اللون"],
        steps: [
          "يضاء الشق الأول بالضوء أحادي اللون ثم يسقط الضوء على الشقين المزدوجين.",
          "نلاحظ على الشاشة ظهور مناطق مضيئة وأخرى مظلمة متعاقبة تسمى (هدب التداخل)."
        ],
        conclusion: "إثبات الطبيعة الموجية للضوء وحساب الطول الموجي للضوء المستعمل من خلال قانون التداخل."
      },
      {
        id: 7,
        chapter: "5",
        chapterName: "الفصل الخامس: الفيزياء الحديثة",
        title: "نشاط: دراسة الظاهرة الكهروضوئية",
        tools: ["خلية كهروضوئية", "فولطميتر", "أميتر رقمي", "مصدر فولتية مستمرة يمكن تغيير جهده", "مصدر ضوئي"],
        steps: [
          "نربط الخلية والأميتر والمصدر على التوالي والفولطميتر على التوازي.",
          "نضيء لوح الخلية (الباعث) بضوء تردده أكبر من تردد العتبة، ونلاحظ انحراف الأميتر.",
          "عند زيادة شدة الضوء المضاء نلاحظ زيادة تيار الإشباع.",
          "عند عكس قطبية المصدر يصبح التيار صفراً عند جهد معين يسمى (جهد القطع أو الإيقاف)."
        ],
        conclusion: "انبعاث الإلكترونات الضوئية يعتمد على تردد الضوء الساقط، وشدة الضوء تزيد من عدد الإلكترونات المنبعثة (تيار الإشباع)."
      },
      {
        id: 8,
        chapter: "6",
        chapterName: "الفصل السادس: فيزياء الحالة الصلبة",
        title: "نشاط: توليد الأزواج (إلكترون - فجوة) بالتأثير الحراري",
        tools: ["بلورة شبه موصل نقي (سليكون أو جيرمانيوم)", "مصدر حراري", "أميتر حساس", "مصدر فولتية مستمر"],
        steps: [
          "نربط البلورة في دائرة كهربائية مغلقة مع الأميتر والمصدر.",
          "في درجة حرارة الصفر المطلق تكون البلورة عازلة ولا يسري تيار.",
          "عند رفع درجة الحرارة نلاحظ انحراف مؤشر الأميتر متزايداً."
        ],
        conclusion: "الطاقة الحرارية تكسر الأواصر التساهمية وتولد أزواجاً من (الإلكترونات والفجوات) مما يزيد القابلية للتوصيل الكهربائي."
      },
      {
        id: 9,
        chapter: "7",
        chapterName: "الفصل السابع: الأطياف الذرية والليزر",
        title: "نشاط: دراسة أنواع الأطياف (دراسة طيف الانبعاث والامتصاص)",
        tools: ["مطياف", "منشور زجاجي", "أنابيب تفريغ تحتوي غازات مختلفة (هيدروجين، نيون)", "مصدر كهربائي عالي الجهد"],
        steps: [
          "نربط أنبوب التفريغ بالمصدر العالي الجهد ليتوهج الغاز.",
          "ننسق الضوء الساقط من الأنبوب ليمر عبر شق المطياف ويدخل المنشور.",
          "نلاحظ الصور الملونة (الأطياف) الظاهرة عبر تلسكوب المطياف."
        ],
        conclusion: "الأطياف تقسم إلى أطياف انبعاث (مستمرة، خطية، حزمية) وأطياف امتصاص، ولكل عنصر طيف خطي خاص ومميز يعتبر بصمة ذرية له."
      }
    ];

    let currentChapter = 'all';

    function renderExperiments() {
      const container = document.getElementById('experimentsContainer');
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      container.innerHTML = '';

      const filteredData = data.filter(item => {
        const matchesChapter = (currentChapter === 'all' || item.chapter === currentChapter);
        const matchesSearch = item.title.toLowerCase().includes(searchVal) ||
                              item.tools.some(t => t.toLowerCase().includes(searchVal)) ||
                              item.chapterName.toLowerCase().includes(searchVal);
        return matchesChapter && matchesSearch;
      });

      if (filteredData.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 30px; color: #777;">لا توجد أنشطة تطابق البحث.</div>';
        return;
      }

      filteredData.forEach(exp => {
        const card = document.createElement('div');
        card.className = 'experiment-card';

        const toolsList = exp.tools.map(t => `<li>${t}</li>`).join('');
        const stepsList = exp.steps.map(s => `<li>${s}</li>`).join('');

        card.innerHTML = `
          <div class="card-header">
            <h2 class="card-title">${exp.title}</h2>
            <span class="chapter-tag">${exp.chapterName}</span>
          </div>
          <div class="section-title">أدوات النشاط:</div>
          <ul>${toolsList}</ul>
          <div class="section-title">خطوات النشاط:</div>
          <ol>${stepsList}</ol>
          <div class="conclusion">
            <strong>الاستنتاج: </strong>${exp.conclusion}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function setFilter(chap, btn) {
      currentChapter = chap;
      document.querySelectorAll('.filter-buttons .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderExperiments();
    }

    function filterExperiments() {
      renderExperiments();
    }

    // التشغيل الأول
    renderExperiments();
  </script>
</body>
</html>
